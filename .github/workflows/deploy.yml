name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run build
      # Build the review branch into a separate /preview/ directory.
      # Production remains at /character-sheet/ and is built from main.
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: audit/template-v2-pipeline
          path: preview-source
      - name: Install preview dependencies
        run: npm install --prefix preview-source
      - name: Build isolated preview
        run: npm run build --prefix preview-source -- --base /character-sheet/preview/
      - name: Add preview to Pages artifact
        run: |
          mkdir -p dist/preview
          cp -a preview-source/dist/. dist/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
